name: Run project orchestrator

on:
  push:
    paths:
      - "toolkit/**"
      - "data/**"
      - "scripts/**"
      - "products/**"
      - "site/**"
      - ".github/workflows/orchestrator.yml"
  pull_request:
    paths:
      - "toolkit/**"
      - "data/**"
      - "scripts/**"
      - "products/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pipeline
        run: python3 toolkit/orchestrator/orchestrator.py run
