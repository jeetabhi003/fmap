name: Run project orchestrator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run pipeline (private inputs are absent here, so those departments report pending or blocked)
        run: python3 toolkit/orchestrator/orchestrator.py run
      - name: Generated site matches the committed site
        run: git diff --exit-code -- site/
